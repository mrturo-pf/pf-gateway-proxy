name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pf-gateway-proxy-production
  cancel-in-progress: false

env:
  PROJECT_ID: coreassistant-474022
  REGION: us-central1
  SERVICE_NAME: pf-gateway-proxy
  RUNTIME_SERVICE_ACCOUNT: pf-gateway-proxy@coreassistant-474022.iam.gserviceaccount.com
  BUILDER_SERVICE_ACCOUNT: pf-gateway-proxy-builder@coreassistant-474022.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/646185261155/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc
  DEPLOYER_SERVICE_ACCOUNT: pf-gateway-proxy-deployer@coreassistant-474022.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: GCP
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Deploy proxy
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --source=. \
            --build-service-account="projects/$PROJECT_ID/serviceAccounts/$BUILDER_SERVICE_ACCOUNT" \
            --no-allow-unauthenticated \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=30 \
            --set-env-vars="REFERENCE_URL=https://pf-svc-reference-yqd4p7fzaa-uc.a.run.app,INCOME_URL=https://pf-svc-income-yqd4p7fzaa-uc.a.run.app" \
            --quiet
