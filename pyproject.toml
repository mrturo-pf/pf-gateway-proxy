[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pf-svc-gateway-proxy"
version = "0.1.0"
description = "Scale-to-zero routing facade for PF Cloud Run services"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "google-auth>=2.35",
  "requests>=2.32",
  "httpx>=0.27",
  "structlog>=25.4",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
extend-select = ["D", "E", "W", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
